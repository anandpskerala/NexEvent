apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      containers:
        - name: message-service
          image: anandpskerala/message-service:v1.0.2
          ports:
            - containerPort: 5004
          envFrom:
            - secretRef:
                name: message-env
          env:
            - name: KAFKA_BROKER
              value: kafka.default.svc.cluster.local:9092
            - name: USER_SERVICE
              value: http://user-service:5001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"