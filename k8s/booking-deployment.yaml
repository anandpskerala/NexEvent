apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: anandpskerala/booking-service:v1.0.3
          ports:
            - containerPort: 5005
          envFrom:
            - secretRef:
                name: booking-env
          env:
            - name: KAFKA_BROKER
              value: kafka.default.svc.cluster.local:9092
            - name: FRONTEND_URL
              value: https://nexevent.appxstore.shop
            - name: USER_SERVICE
              value: http://user-service.default.svc.cluster.local:5001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - port: 5005
      targetPort: 5005